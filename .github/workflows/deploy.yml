name: Deploy to Scaleway Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build
        env:
          PROCONNECT_CLIENT_ID: ${{ secrets.PROCONNECT_CLIENT_ID }}
          PROCONNECT_CLIENT_SECRET: ${{ secrets.PROCONNECT_CLIENT_SECRET }}

      - name: Install Scaleway CLI
        run: |
          curl -sL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh

      - name: Deploy to Scaleway Pages
        run: |
          scw config set secret-key=$SCW_SECRET_KEY
          scw config set project-id=$SCW_PROJECT_ID
          scw config set default-region=fr-par
          scw object bucket create name=$SCW_BUCKET_NAME region=fr-par project-id=$SCW_PROJECT_ID 2>/dev/null || true
          scw object sync source=dist/ destination=s3://$SCW_BUCKET_NAME
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_BUCKET_NAME: ${{ secrets.SCW_BUCKET_NAME }}