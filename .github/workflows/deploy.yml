name: Deploy to Scaleway Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Deploy to Scaleway Object Storage
        uses: jakejarvis/s3-sync-action@master
        with:
          args: --delete --acl public-read
        env:
          AWS_S3_BUCKET: ${{ secrets.SCW_BUCKET_NAME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_S3_ENDPOINT: https://s3.fr-par.scw.cloud
          AWS_REGION: fr-par
          SOURCE_DIR: dist