<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Administration — Mon Village</title>
    <link href="/decap-config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      /* Masque le back-office aux moteurs de recherche visuellement */
      body { margin: 0; }
      /* Masque le logo Decap CMS par défaut sur l'écran de connexion
         (aucune option de config pour le désactiver ; le nom de classe
         généré inclut le nom du composant, plus stable qu'un ciblage
         par position/couleur). */
      [class*="DecapLogoIcon"] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="nc-root"></div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      var BLEU = "#003189", GRIS_F = "#F5F5F5", GRIS_T = "#6B6B6B", TEXTE = "#161616";

      var ConfigPreview = createClass({
        render: function () {
          var e = this.props.entry;
          var g = function (k) { return e.getIn(["data", k], ""); };
          var champs = ["siren", "nom_maire", "adresse", "telephone", "email", "nom_domaine"];
          return h(
            "div",
            { style: { padding: "1.5rem", fontFamily: "Arial, sans-serif" } },
            h("h2", { style: { color: BLEU, borderLeft: "5px solid #E1000F", paddingLeft: "1rem" } }, g("nom_commune") || "Nom de la commune"),
            h(
              "dl",
              { style: { display: "flex", flexDirection: "column", gap: "0.4rem", fontSize: "0.9rem" } },
              champs.map(function (k) {
                return h(
                  "div",
                  { key: k, style: { display: "flex", gap: "1rem", borderBottom: "1px solid #e5e5e5", padding: "0.3rem 0" } },
                  h("dt", { style: { fontWeight: 600, minWidth: "160px" } }, k),
                  h("dd", { style: { color: GRIS_T } }, g(k))
                );
              })
            )
          );
        },
      });
      CMS.registerPreviewTemplate("config", ConfigPreview);

      var COULEURS_URGENCE = {
        jaune: { bg: "#FEF7CD", border: "#F5A623", texte: "#7D4E00", label: "Avis" },
        orange: { bg: "#FDEBD0", border: "#E67E22", texte: "#7D3000", label: "Alerte" },
        rouge: { bg: "#FDEDEC", border: "#E1000F", texte: "#7D0000", label: "Urgence" },
      };
      var UrgencePreview = createClass({
        render: function () {
          var e = this.props.entry;
          var actif = e.getIn(["data", "actif"]);
          var niveau = e.getIn(["data", "niveau"]) || "jaune";
          var texte = e.getIn(["data", "texte"]) || "";
          var c = COULEURS_URGENCE[niveau] || COULEURS_URGENCE.jaune;
          if (!actif) {
            return h("div", { style: { padding: "1.5rem", fontFamily: "Arial, sans-serif", color: GRIS_T, fontStyle: "italic" } }, "Bandeau désactivé — rien ne s'affichera sur le site.");
          }
          return h(
            "div",
            { style: { padding: "1.5rem", fontFamily: "Arial, sans-serif" } },
            h(
              "div",
              { style: { display: "flex", alignItems: "center", gap: "1rem", padding: "0.875rem 1.5rem", background: c.bg, borderLeft: "6px solid " + c.border, color: c.texte, fontWeight: 500 } },
              h("span", { style: { flexShrink: 0, fontSize: "0.75rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.08em", padding: "0.2rem 0.6rem", borderRadius: "3px", background: c.border, color: "#fff" } }, c.label),
              h("p", { style: { margin: 0 } }, texte)
            )
          );
        },
      });
      CMS.registerPreviewTemplate("urgence", UrgencePreview);

      var JOURS = [
        ["lundi", "Lundi"], ["mardi", "Mardi"], ["mercredi", "Mercredi"], ["jeudi", "Jeudi"],
        ["vendredi", "Vendredi"], ["samedi", "Samedi"], ["dimanche", "Dimanche"],
      ];
      var HorairesPreview = createClass({
        render: function () {
          var e = this.props.entry;
          return h(
            "div",
            { style: { padding: "1.5rem", fontFamily: "Arial, sans-serif", maxWidth: "360px" } },
            h("h3", { style: { color: BLEU, marginBottom: "0.75rem" } }, "Horaires d'ouverture"),
            h(
              "dl",
              { style: { display: "flex", flexDirection: "column", gap: "0.4rem" } },
              JOURS.map(function (j) {
                var val = e.getIn(["data", j[0]]);
                if (!val) return null;
                return h(
                  "div",
                  { key: j[0], style: { display: "flex", justifyContent: "space-between", gap: "1rem", fontSize: "0.9rem", padding: "0.35rem 0", borderBottom: "1px solid " + GRIS_F } },
                  h("dt", { style: { fontWeight: 600 } }, j[1]),
                  h("dd", { style: { color: GRIS_T, textAlign: "right" } }, val)
                );
              })
            )
          );
        },
      });
      CMS.registerPreviewTemplate("horaires", HorairesPreview);

      var ActusPreview = createClass({
        render: function () {
          var e = this.props.entry;
          var titre = e.getIn(["data", "titre"]) || "Sans titre";
          var date = e.getIn(["data", "date"]) || "";
          return h(
            "div",
            { style: { padding: "1.5rem", fontFamily: "Arial, sans-serif", maxWidth: "480px" } },
            h(
              "div",
              { style: { borderLeft: "4px solid " + BLEU, padding: "0.75rem 1rem", background: GRIS_F, borderRadius: "0 4px 4px 0" } },
              h("time", { style: { display: "block", fontSize: "0.78rem", color: GRIS_T, marginBottom: "0.35rem", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.05em" } }, date),
              h("h3", { style: { fontSize: "1rem", fontWeight: 700, color: BLEU, marginBottom: "0.35rem" } }, titre),
              h("div", { style: { fontSize: "0.9rem", color: TEXTE, lineHeight: 1.6 } }, this.props.widgetFor("body"))
            )
          );
        },
      });
      CMS.registerPreviewTemplate("actus", ActusPreview);

      var AssociationsPreview = createClass({
        render: function () {
          var e = this.props.entry;
          var nom = e.getIn(["data", "nom"]) || "";
          var description = e.getIn(["data", "description"]) || "";
          var email = e.getIn(["data", "email"]);
          return h(
            "div",
            { style: { padding: "1.5rem", fontFamily: "Arial, sans-serif", maxWidth: "280px" } },
            h(
              "div",
              { style: { background: GRIS_F, borderTop: "3px solid " + BLEU, borderRadius: "0 0 4px 4px", padding: "1rem", display: "flex", flexDirection: "column", gap: "0.4rem" } },
              h("strong", { style: { color: BLEU, fontWeight: 600 } }, nom),
              h("p", { style: { fontSize: "0.875rem", color: GRIS_T } }, description),
              email ? h("a", { href: "mailto:" + email, style: { color: BLEU, fontSize: "0.875rem", fontWeight: 600, textDecoration: "none" } }, "Contacter") : null
            )
          );
        },
      });
      CMS.registerPreviewTemplate("associations", AssociationsPreview);

      var IdentitePreview = createClass({
        render: function () {
          var e = this.props.entry;
          var logo = e.getIn(["data", "logo"]);
          var photoMairie = e.getIn(["data", "photo_mairie"]);
          return h(
            "div",
            { style: { padding: "1.5rem", fontFamily: "Arial, sans-serif", display: "flex", flexDirection: "column", gap: "1.5rem" } },
            h(
              "div",
              {},
              h("p", { style: { fontSize: "0.78rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", color: GRIS_T, marginBottom: "0.5rem" } }, "Logo / blason"),
              logo ? h("img", { src: this.props.getAsset(logo).toString(), style: { height: "64px", width: "auto" } }) : h("p", { style: { color: GRIS_T, fontStyle: "italic" } }, "Aucun logo")
            ),
            h(
              "div",
              {},
              h("p", { style: { fontSize: "0.78rem", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em", color: GRIS_T, marginBottom: "0.5rem" } }, "Photo de la mairie"),
              photoMairie ? h("img", { src: this.props.getAsset(photoMairie).toString(), style: { width: "100%", maxWidth: "360px", maxHeight: "220px", objectFit: "cover", borderRadius: "4px" } }) : h("p", { style: { color: GRIS_T, fontStyle: "italic" } }, "Aucune photo")
            )
          );
        },
      });
      CMS.registerPreviewTemplate("identite", IdentitePreview);

      var ConseilPreview = createClass({
        render: function () {
          var e = this.props.entry;
          var nom = e.getIn(["data", "nom"]) || "";
          var fonction = e.getIn(["data", "fonction"]) || "";
          var photo = e.getIn(["data", "photo"]);
          return h(
            "div",
            { style: { padding: "1.5rem", fontFamily: "Arial, sans-serif", display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", gap: "0.4rem", maxWidth: "160px" } },
            photo
              ? h("img", { src: this.props.getAsset(photo).toString(), style: { width: "96px", height: "96px", borderRadius: "50%", objectFit: "cover", border: "3px solid " + BLEU } })
              : h("span", { style: { display: "block", width: "96px", height: "96px", borderRadius: "50%", background: GRIS_F, border: "3px solid " + BLEU } }),
            h("strong", { style: { color: BLEU, fontWeight: 600 } }, nom),
            h("p", { style: { fontSize: "0.85rem", color: GRIS_T, margin: 0 } }, fonction)
          );
        },
      });
      CMS.registerPreviewTemplate("conseil", ConseilPreview);
    </script>
    <script>
      // Le lien "Test Backend" est codé en dur dans le bundle decap-cms (non
      // configurable) ; on le supprime après montage. Fragile : à revérifier
      // après toute mise à jour de version de Decap CMS.
      new MutationObserver(function () {
        var lien = document.querySelector('a[href="https://www.decapcms.org/docs/test-backend"]');
        if (lien) lien.remove();
      }).observe(document.body, { childList: true, subtree: true });

      // Decap CMS affiche un petit logo "Decap CMS" en filigrane en bas de
      // l'écran de connexion dès qu'un logo personnalisé (logo.src) est
      // configuré — non désactivable via la config. On le masque via son
      // style calculé (position:absolute; bottom:10px; couleur #c4c6d2),
      // seule signature disponible car ni classe ni attribut stables.
      // Fragile : à revérifier après toute mise à jour de version de Decap CMS.
      new MutationObserver(function () {
        document.querySelectorAll("svg").forEach(function (svg) {
          var style = getComputedStyle(svg);
          if (style.position === "absolute" && style.bottom === "10px" && style.color === "rgb(196, 198, 210)") {
            svg.style.display = "none";
          }
        });
      }).observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
</html>
